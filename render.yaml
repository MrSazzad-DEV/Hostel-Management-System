services:
  - type: web
    name: haven-hostel
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build --workspace client
    startCommand: npm run db:seed && npm run start:prod --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        value: https://mrsazzad-dev.github.io
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
