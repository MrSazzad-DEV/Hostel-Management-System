services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hostel_management
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel
    ports:
      - "5432:5432"
    volumes:
      - hostel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel -d hostel_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hostel_data:
